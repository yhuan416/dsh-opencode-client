name: check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Deliberately the minimum supported runtime; publish.yml uses Node 24
          # because trusted publishing needs npm >= 11.5.1.
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Offline plugin checks
        run: npm run check
