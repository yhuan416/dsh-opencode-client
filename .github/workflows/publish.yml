name: publish

# Tag-driven npm publishing. The manifest gate asserts that a tag on HEAD equals
# `v<version>`, so a tag that disagrees with package.json fails before npm is
# contacted; `prepublishOnly` runs the same gate again right before packing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm for real (unchecked runs `npm publish --dry-run`)
        type: boolean
        default: false

permissions:
  contents: read
  # npm provenance: an OIDC token, when the package is published from a public
  # repo. `NPM_TOKEN` below is the fallback credential for classic tokens.
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate runs `git describe --exact-match --tags HEAD`.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11.x: trusted publishing needs npm >= 11.5.1 and
          # Node >= 22.14.0 (Node 22 still bundles npm 10, which cannot do OIDC).
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Check the npm CLI for trusted publishing (>= 11.5.1)
        run: |
          node --version
          npm --version
          node -e '
            const version = require("child_process").execSync("npm --version").toString().trim()
            const [major, minor, patch] = version.split(".").map(Number)
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)))
            if (!ok) {
              console.error(`npm ${version} cannot do trusted publishing; need >= 11.5.1`)
              process.exit(1)
            }
          '
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Gates (syntax · client · manifest · tests)
        run: npm run check
      - name: Pack check
        run: npm pack --dry-run
      - name: Skip an already-published version
        id: published
        # Re-running a tag (or tagging a commit whose version was published by
        # hand first) must not fail the release: npm refuses to publish over an
        # existing version, so decide here and skip the step instead.
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "${GITHUB_OUTPUT:-/dev/null}"
            echo "$name@$version is already on the registry; skipping publish."
          else
            echo "published=false" >> "${GITHUB_OUTPUT:-/dev/null}"
            echo "$name@$version is not on the registry yet."
          fi
      - name: Publish
        if: (github.event_name == 'push' || inputs.publish) && steps.published.outputs.published == 'false'
        # With a trusted publisher configured for this repository and this exact
        # workflow filename, npm exchanges the OIDC token (id-token: write) and
        # no secret is involved. NPM_TOKEN is only the fallback for a package
        # that has no trusted publisher yet; remove it once OIDC publishes work.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        run: npm publish --dry-run --access public